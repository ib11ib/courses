# ─────────────────────────────────────────────────────────────
#  Настройки сайта. Обычно менять ничего не нужно.
#  Курсы лежат в папке docs/: одна папка = один курс.
# ─────────────────────────────────────────────────────────────
site_name: Мои курсы
site_description: Курсы по программированию — читать онлайн или скачать
site_url: https://ib11ib.github.io/courses/
repo_url: https://github.com/ib11ib/courses
repo_name: ib11ib/courses
edit_uri: ""

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: ru
  icon:
    logo: material/school-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Тема как в системе
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: [ru, en]

hooks:
  - hooks/obsidian.py

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/progress.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - nl2br
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tilde:
      subscript: false
  - pymdownx.keys
  - pymdownx.magiclink
